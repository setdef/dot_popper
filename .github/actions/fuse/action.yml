# Fuses Dot Popper with `lota fuse` on this runner's platform (PACKAGING.md),
# as Lota 0.5.5's README documents: Lota's gem for the platform, from
# vendor/cache and checked against the SHA256SUMS of Lota's release, is
# installed, and lota fuse builds the app into $RUNNER_TEMP/fuse. It also
# writes $RUNNER_TEMP/build.txt, the lines a kit names its build by, and
# sets APP_VERSION: before 1.0.0 a playtest tag's own, stamped into this
# working tree's fledge.yml and doc/privacy.json first; otherwise
# fledge.yml's, which a website tag must match (script/release_version.rb).
name: lota fuse
description: Fuse Dot Popper for this runner's platform with Lota's release gem
inputs:
  platform:
    description: Lota's gem platform, such as x64-mingw-ucrt
    required: true
runs:
  using: composite
  steps:
    - name: Name the build
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        version=$(ruby script/release_version.rb stamp "$GITHUB_REF_NAME" | tr -d '\r')
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"
        {
          echo "Dot Popper $GITHUB_REF_NAME, commit $GITHUB_SHA, version $version"
          echo "Fused by lota fuse, from Lota $LOTA_VERSION's release gem for $PLATFORM"
          echo "Built $(date -u +%Y-%m-%d) by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        } > "$RUNNER_TEMP/build.txt"
        cat "$RUNNER_TEMP/build.txt"

    - name: Check Lota's gem against its release, and install it
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        GH_TOKEN: ${{ github.token }}
      run: |
        gem_file="vendor/cache/lota-$LOTA_VERSION-$PLATFORM.gem"
        gh release download "v$LOTA_VERSION" -R setdef/Lota -p SHA256SUMS -D "$RUNNER_TEMP/lota-release"
        expected=$(grep " lota-$LOTA_VERSION-$PLATFORM.gem\$" "$RUNNER_TEMP/lota-release/SHA256SUMS" | cut -d' ' -f1)
        if command -v sha256sum > /dev/null; then actual=$(sha256sum "$gem_file" | cut -d' ' -f1); else actual=$(shasum -a 256 "$gem_file" | cut -d' ' -f1); fi
        echo "release: $expected"; echo "vendor/cache: $actual"
        [ -n "$expected" ] && [ "$expected" = "$actual" ]
        gem install --local "$gem_file"
        ruby -S lota --version

    # lota fuse leaves out of the app what only the repository needs (a
    # fused LÖVE game ships the whole folder it's given), and what the
    # build's channel, as script/set_build_channel.rb set it, leaves out
    # (script/channel_contents.rb; nothing in a test build).
    - name: lota fuse
      shell: bash
      run: |
        exclude=()
        for path in test doc sig script playtest android ios macos windows .github Rakefile Steepfile mise.toml mise.lock mise.android.toml mise.ios.toml \
          AGENTS.md GLOSSARY.md INSIPIRATION.md PACKAGING.md README.md .gitignore .gitattributes \
          gems/dot_popper-gameplay/sig gems/dot_popper-gameplay/test gems/dot_popper-gameplay/Rakefile gems/dot_popper-gameplay/Steepfile \
          gems/dot_popper-shared/sig gems/dot_popper-shared/test gems/dot_popper-shared/Rakefile gems/dot_popper-shared/Steepfile; do
          exclude+=(--exclude "$path")
        done
        channel_excludes=$(ruby script/channel_contents.rb excludes | tr -d '\r')
        for path in $channel_excludes; do
          echo "left out for the build's channel: $path"
          exclude+=(--exclude "$path")
        done
        # The Fledge Gemfile.lock pins, which the phone builds take too.
        LOTA_FLEDGE_REF=$(ruby -r./script/packaged_app -e 'print PackagedApp.fledge_ref' | tr -d '\r')
        export LOTA_FLEDGE_REF
        echo "Fledge $LOTA_FLEDGE_REF"
        # lota fuse reads conf.rb in its own Ruby, with no bundle, and
        # conf.rb loads the game's code, so the game's own gems (gems/,
        # PACKAGING.md) are put on that Ruby's load path by their folders.
        own_gems=()
        for lib in gems/*/lib; do own_gems+=(-I "$lib"); done
        ruby "${own_gems[@]}" -S lota fuse . "${exclude[@]}" --identifier "$IDENTIFIER" --app-version "$APP_VERSION" --icon icons/icon --out "$RUNNER_TEMP/fuse"
        ls -la "$RUNNER_TEMP/fuse"
