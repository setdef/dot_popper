# Runs the unit tests (bundle exec rake test) on Windows, on every push
# to trunk, so a test that fails only there turns the commit red within
# minutes. The Package workflow's Test job runs them on Linux; its
# Windows jobs build and play the app, but run no test. Ruby on Windows
# differs where tests most often trip: it writes text files with CR LF,
# and its paths have drive letters and back slashes.
#
# A run in progress finishes, and of the pushes made meanwhile only the
# newest waits, as in the Package workflow, so one run may cover several
# pushes. By hand (workflow_dispatch), `commit` tests any commit GitHub
# has instead of the branch's tip, such as one of those pushes, to find
# which one broke Windows.

name: Windows tests

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to test (a SHA GitHub has); empty tests the branch's tip
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}-${{ inputs.commit }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUNDLE_FROZEN: "true"

jobs:
  test:
    name: rake test on Windows
    runs-on: windows-latest
    # The suite takes about six minutes here with its setup. A test that
    # hangs must not hold every later run behind it for long.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      # The default toolchain (MSYS2's UCRT64 GCC), since a few gems in
      # the bundle build native extensions; the store helper's test
      # builds with the same GCC. Its MSYS2 also has the zlib1.dll the
      # pinned Windows Ruby does not carry. Then that Ruby, first on the
      # PATH (mise.toml), and the bundle installed with it.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: head
          windows-toolchain: default
          bundler: none
      - uses: ./.github/actions/windows-ruby
      - run: bundle install

      - run: bundle exec rake test
