# The Ruby Dot Popper runs on. Lota 0.5 needs Ruby 4.1, which is not
# released yet, so on Linux and macOS it is the preview .ruby-version also
# names. mise.lock fixes where that Ruby comes from on each system: the
# prebuilt archive of jdx/ruby's release 4.1.0-preview1-1, checked by its
# SHA-256, which mise unpacks in seconds. Without the lock, a mise older
# than 2026.11.10 looks for a prebuilt Ruby only among jdx/ruby's full
# releases, which a preview is not, and compiles one instead.
#
# RubyInstaller publishes no 4.1 preview for Windows, so mise has no
# Windows Ruby to install for that version. There the Ruby is
# RubyInstaller's head build of 2026-11-10 (ruby 4.1.0dev, ruby_version
# 4.1.0+6), the copy Fledge's release inputs-rubyinstaller-head-20261110
# keeps, on which Lota 0.5.5's Windows gems are built and which Fledge
# v0.14.0's Windows runtime is made from: Lota's README at v0.5.5 says to
# use that build, and its .github/windows_ruby.env names this URL and
# SHA-256. Another day's head build need not load Lota's gem. The Gemfile
# refuses any other Windows Ruby, and .github/actions/windows-ruby gives
# CI's Windows jobs the same file, checked the same way.
#
# The head build carries no zlib1.dll, which its zlib extension loads, and
# no compiler for the gems in the bundle that build native extensions. So
# on Windows mise also installs an MSYS2 with UCRT64's GCC, make and zlib:
# the archive ruby/setup-msys2-gcc publishes for each dated release, which
# setup-ruby unpacks for a head Ruby, checked by its SHA-256. It is a whole
# MSYS2 folder, so a bash with mise on the PATH is all a clone needs.
# RubyInstaller's Ruby looks for DLLs it does not carry only in the folders
# RUBY_DLL_PATH names, so that names this MSYS2's UCRT64 bin folder, as
# Lota's own .github/windows_prepush.sh sets it; and it builds a native
# extension with the MSYS2 that MSYS2_PATH names
# (RubyInstaller::Runtime.enable_msys_apps). The same bin folder is on the
# PATH, for the GCC the Windows store helper's test builds with.
[tools]
ruby = { version = "4.1.0-preview1", os = ["linux", "macos"] }
"http:rubyinstaller-head" = { version = "20261110", url = "https://github.com/setdef/Fledge/releases/download/inputs-rubyinstaller-head-20261110/rubyinstaller-head-x64.7z", checksum = "sha256:901473edafd6b174d79978fc109d3df3ab73b1436719233f35c1a31b5b18bf58", strip_components = 1, bin_path = "bin", os = ["windows"] }
"http:msys2_ucrt64" = { version = "20261120.002211", url = "https://github.com/ruby/setup-msys2-gcc/releases/download/v20261120.002211/msys2-ucrt64.7z", checksum = "sha256:4d97fe700099a44d003391b99d3595929f4911ace6a5f43ca84a7f25adf5ba32", bin_path = "ucrt64/bin", os = ["windows"] }

[env]
RUBY_DLL_PATH = { value = "{% if tools.msys2_ucrt64 is defined %}{{ tools.msys2_ucrt64.path }}\\ucrt64\\bin{% endif %}", tools = true }
MSYS2_PATH = { value = "{% if tools.msys2_ucrt64 is defined %}{{ tools.msys2_ucrt64.path }}{% endif %}", tools = true }
